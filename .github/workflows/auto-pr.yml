name: Auto PR and Assign Reviewer

on:
  push:
    branches:
      - '**'
      # Exclude main/master to avoid PRs from default branch
      - '!main'
      - '!master'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Auto PR: ${{ github.ref_name }}'
          title: 'Auto PR from ${{ github.ref_name }}'
          body: 'This pull request was automatically created.'
          base: main
          branch: ${{ github.ref_name }}

      - name: Request review from mahmudka
        if: steps.cpr.outputs.pull-request-url != ''
        uses: peter-evans/request-review@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          reviewers: mahmudka
