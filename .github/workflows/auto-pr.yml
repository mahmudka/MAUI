name: Auto PR with GitHub CLI

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!master'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request with gh cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists for this branch
          pr_exists=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq 'length')
          if [ "$pr_exists" -eq 0 ]; then
            PR_URL=$(gh pr create \
              --title "Auto PR from $GITHUB_REF_NAME" \
              --body "This pull request was automatically created by workflow." \
              --base master \
              --head "$GITHUB_REF_NAME" \
              --reviewer mahmudka 2>&1) || true
            if echo "$PR_URL" | grep -q "No commits between"; then
              echo "No new commits vs master, skipping PR creation."
            elif echo "$PR_URL" | grep -q "http"; then
              echo "PR created: $PR_URL"
            else
              echo "PR creation output: $PR_URL"
            fi
          else
            echo "PR already exists for this branch."
          fi
